<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แจ้งซ่อมเครื่องจักร</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Tailwind CSS ช่วยจัดแต่งสไตล์ -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <h2 class="text-xl font-bold text-center text-gray-800 mb-4">🛠️ ฟอร์มแจ้งซ่อมเครื่องจักร</h2>
    
    <form id="repairForm" class="space-y-4">
      
      <!-- เลือกชั้น -->
      <div>
        <label class="block text-sm font-medium text-gray-700">ชั้น / พื้นที่</label>
        <select id="floor" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
          <option value="">-- เลือกชั้น --</option>
          <option value="ชั้น 3">ชั้น 3</option>
          <option value="ชั้น 4">ชั้น 4</option>
        </select>
      </div>

      <!-- เลือก Line -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Line</label>
        <select id="line" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
          <option value="">-- เลือก Line --</option>
          <option value="LINE B">LINE B</option>
          <option value="LINE C">LINE C</option>
          <option value="LINE D">LINE D</option>
          <option value="LINE E">LINE E</option>
          <option value="LINE F">LINE F</option>
          <option value="LINE G">LINE G</option>
        </select>
      </div>

      <!-- ผู้แจ้ง -->
      <div>
        <label class="block text-sm font-medium text-gray-700">ชื่อผู้แจ้ง</label>
        <input type="text" id="reporter" required placeholder="ใส่ชื่อผู้แจ้งซ่อม" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>

      <!-- รหัส/ชื่อเครื่องจักร -->
      <div>
        <label class="block text-sm font-medium text-gray-700">เครื่องจักร / หมายเลข</label>
        <input type="text" id="machine" required placeholder="เช่น MC-01 หรือ 1111" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>

      <!-- อาการเสีย -->
      <div>
        <label class="block text-sm font-medium text-gray-700">อาการเสีย</label>
        <textarea id="issue" rows="3" required placeholder="อธิบายอาการเสียเบื้องต้น" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></textarea>
      </div>

      <!-- แนบรูปภาพ (Optional) -->
      <div>
        <label class="block text-sm font-medium text-gray-700">แนบรูปภาพ (ถ้ามี)</label>
        <input type="file" id="imageInput" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
      </div>

      <!-- ปุ่มส่งข้อมูล -->
      <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white py-2 px-4 rounded-md font-bold hover:bg-green-700 transition duration-200">
        ส่งข้อมูลแจ้งซ่อม
      </button>

    </form>
  </div>

  <script>
    // ⚠️ อย่าลืมนำ URL Web App จาก Google Apps Script (หลังกด Deploy) มาใส่ตรงนี้
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec";
    const LIFF_ID = "2011319319-1bUfgtSJ"; 

    // เริ่มต้นใช้งาน LIFF
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        if (LIFF_ID && LIFF_ID !== "2011319319-1bUfgtSJ") {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            document.getElementById("reporter").value = profile.displayName || "";
          }
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
      }
    });

    // แปลงไฟล์รูปภาพเป็น Base64
    function getBase64(file) {
      return new Promise((resolve, reject) => {
        if (!file) resolve("");
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // จัดการเมื่อกดปุ่ม Submit Form
    document.getElementById("repairForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "กำลังบันทึกข้อมูล...";

      try {
        const fileInput = document.getElementById("imageInput");
        const file = fileInput.files[0];
        const base64Image = file ? await getBase64(file) : "";

        // จัดเตรียม Payload ส่งไปยัง Apps Script
        const payload = {
          action: "CREATE_REPAIR_JOB",
          floor: document.getElementById("floor").value,
          line: document.getElementById("line").value,
          reporter: document.getElementById("reporter").value,
          machine: document.getElementById("machine").value,
          issue: document.getElementById("issue").value,
          image: base64Image // ส่ง Base64 หรือ ""
        };

        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (result.status === "success") {
          alert("บันทึกการแจ้งซ่อมสำเร็จ! รหัสงาน: " + result.jobId);
          if (typeof liff !== "undefined" && liff.isInClient()) {
            liff.closeWindow(); // ปิดหน้าต่าง LIFF บน LINE
          } else {
            document.getElementById("repairForm").reset();
          }
        } else {
          alert("เกิดข้อผิดพลาด: " + (result.error || "ไม่สามารถบันทึกได้"));
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "ส่งข้อมูลแจ้งซ่อม";
      }
    });
  </script>
</body>
</html>
