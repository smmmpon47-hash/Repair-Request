<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ระบบแจ้งซ่อม</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    body {
      background-color: #f0f2f5;
      color: #333;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .form-container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 20px 16px;
    }

    /* =========================
       TAB MENU
    ========================= */

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #eef2f5;
      padding: 4px;
      border-radius: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #1DB954;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      margin-bottom: 4px;
    }

    .form-control,
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      background-color: #f8fafc;
      outline: none;
    }

    .form-control[readonly] {
      background-color: #e2e8f0;
      color: #475569;
    }

    .input-with-btn {
      display: flex;
      gap: 8px;
    }

    .input-with-btn input {
      flex: 1;
    }

    .btn-qr {
      background: #06C755;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-qr svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .file-attach-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      background-color: #f8fafc;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
    }

    .image-preview {
      margin-top: 8px;
      display: none;
      width: 100%;
      max-height: 180px;
      border-radius: 8px;
      overflow: hidden;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .btn-cancel {
      background-color: #f1f5f9;
      color: #64748b;
    }

    .btn-confirm {
      background-color: #1DB954;
      color: #ffffff;
    }

    /* =========================
       MY JOBS
    ========================= */

    .myjobs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .myjobs-title {
      font-size: 14px;
      font-weight: 600;
      color: #475569;
    }

    .refresh-btn {
      border: none;
      background: #e2e8f0;
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
    }

    .job-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      margin-bottom: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid #f1f5f9;
    }

    .job-id {
      color: #334155;
      font-size: 13px;
    }

    .job-badge {
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge-pending {
      background: #fef9c3;
      color: #854d0e;
    }

    .badge-accepted {
      background: #ede9fe;
      color: #6d28d9;
    }

    .badge-progress {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-done {
      background: #dcfce7;
      color: #166534;
    }

    .badge-waiting {
      background: #fff7ed;
      color: #c2410c;
    }

    .badge-cannot {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-forward {
      background: #f3e8ff;
      color: #7e22ce;
    }

    .job-detail-row {
      color: #475569;
      margin-bottom: 4px;
      line-height: 1.5;
    }

    .job-detail-row b {
      color: #334155;
    }

    .job-time {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #e2e8f0;
      color: #64748b;
      font-size: 11px;
    }

    .empty-state {
      text-align: center;
      color: #94a3b8;
      padding: 35px 10px;
      font-size: 13px;
    }

    .loading-state {
      text-align: center;
      color: #94a3b8;
      padding: 25px 10px;
      font-size: 13px;
    }

    .error-state {
      text-align: center;
      color: #ef4444;
      padding: 25px 10px;
      font-size: 13px;
    }

    /* =========================
       TAB 3 PLACEHOLDER
    ========================= */

    .coming-soon {
      text-align: center;
      padding: 50px 15px;
      color: #94a3b8;
    }

    .coming-soon-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .coming-soon-title {
      font-size: 16px;
      font-weight: 500;
      color: #64748b;
    }

    .coming-soon-text {
      font-size: 12px;
      margin-top: 5px;
    }

    /* =========================
       SCANNER
    ========================= */

    #scannerModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }

    .btn-close-scan {
      margin-top: 15px;
      padding: 10px 24px;
      background: #e53e3e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
    }
  </style>

</head>

<body>

  <!-- =========================
       BARCODE SCANNER
  ========================= -->

  <div id="scannerModal">
    <div id="reader"></div>
    <button
      type="button"
      class="btn-close-scan"
      onclick="stopBarcodeScanner()">
      ปิดกล้อง
    </button>
  </div>

  <div class="form-container">

<!-- =========================
     3 TABS
========================= -->

<div class="nav-tabs">

  <button
    class="tab-btn active"
    onclick="switchTab('report')">
    🛠️ แจ้งซ่อม
  </button>

  <button
    class="tab-btn"
    onclick="switchTab('myjobs')">
    📊 งานที่ฉันแจ้ง
  </button>

  <button
    class="tab-btn"
    onclick="switchTab('technician')">
    👨‍🔧 งานของฉัน
  </button>

</div>


<!-- =====================================================
     TAB 1 : แจ้งซ่อม
     ===================================================== -->

<div id="tabReport">

  <form id="repairForm">

    <div class="form-group">
      <label class="form-label">ชั้น</label>

      <select id="floorSelect" required onchange="updateLineOptions()">
        <option value="">-- กรุณาเลือกชั้น --</option>
        <option value="ชั้น 3">ชั้น 3</option>
        <option value="ชั้น 4">ชั้น 4</option>
      </select>
    </div>


    <div class="form-group">
      <label class="form-label">LINE การผลิต</label>

      <select id="lineSelect" required>
        <option value="">-- กรุณาเลือก LINE --</option>
      </select>
    </div>


    <div class="form-group">
      <label class="form-label">ผู้แจ้ง</label>

      <input
        type="text"
        id="reporterInput"
        class="form-control"
        placeholder="กำลังโหลดชื่อผู้แจ้ง..."
        required>
    </div>


    <div class="form-group">

      <label class="form-label">
        รหัสเครื่องจักร
      </label>

      <div class="input-with-btn">

        <input
          type="text"
          id="machineCodeInput"
          class="form-control"
          placeholder="พิมพ์/สแกนรหัสเครื่องจักร"
          required
          oninput="lookupMachineName()">

        <button
          type="button"
          class="btn-qr"
          onclick="startBarcodeScanner('machineCodeInput')">

          <svg viewBox="0 0 24 24">
            <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-3 0h2v3h-2v-3zm3 3h3v5h-2v-3h-1v-2zm-3 2h2v3h-2v-3zm0 3h5v2h-5v-2z"/>
          </svg>

          สแกน
        </button>

      </div>
    </div>


    <div class="form-group">

      <label class="form-label">
        ชื่อเครื่องจักร
      </label>

      <input
        type="text"
        id="machineNameInput"
        class="form-control"
        placeholder="จะแสดงอัตโนมัติ"
        readonly>

      <div
        id="machineStatus"
        style="font-size:11px;margin-top:2px;">
      </div>

    </div>


    <div class="form-group">

      <label class="form-label">
        อาการที่เสีย
      </label>

      <textarea
        id="issueInput"
        class="form-control"
        rows="3"
        placeholder="ระบุอาการเสีย..."
        required>
      </textarea>

    </div>


    <div class="form-group">

      <label class="form-label">
        แนบรูปภาพ
      </label>

      <input
        type="file"
        id="imageInput"
        style="display:none;"
        accept="image/*"
        onchange="previewImage(event)">

      <label
        for="imageInput"
        class="file-attach-btn"
        id="attachBtnText">

        📷 ถ่ายรูป / เลือกรูปภาพ

      </label>

      <div
        class="image-preview"
        id="imagePreview">

        <img
          id="previewImg"
          src="">

      </div>

    </div>


    <div class="button-group">

      <button
        type="button"
        class="btn btn-cancel"
        onclick="closeLiff()">

        ยกเลิก

      </button>

      <button
        type="submit"
        class="btn btn-confirm"
        id="submitBtn">

        ส่งแจ้งซ่อม

      </button>

    </div>

  </form>

</div>


<!-- =====================================================
     TAB 2 : งานที่ฉันแจ้ง
     ===================================================== -->

<div
  id="tabMyJobs"
  style="display:none;">

  <div class="myjobs-header">

    <span class="myjobs-title">
      📊 รายการงานที่ฉันแจ้ง
    </span>

    <button
      class="refresh-btn"
      onclick="loadMyJobs()">

      🔄 รีเฟรช

    </button>

  </div>


  <div id="myJobsContainer">

    <div class="loading-state">
      กำลังโหลดข้อมูล...
    </div>

  </div>

</div>


<!-- =====================================================
     TAB 3 : งานของฉัน
     ยังไม่ทำรอบนี้
     ===================================================== -->

<div
  id="tabTechnician"
  style="display:none;">

  <div class="coming-soon">

    <div class="coming-soon-icon">
      👨‍🔧
    </div>

    <div class="coming-soon-title">
      งานของฉัน
    </div>

    <div class="coming-soon-text">
      หน้าสำหรับช่างกำลังจัดทำ
    </div>

  </div>

</div>

  </div>

  <script>

    /* =====================================================
       CONFIG
       ===================================================== */

    const GAS_WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbyLm1LVkTiwK3PCvPSt3PFA1ifb76KCRsWxC1SkaLdDC-ginxy0RHWstWpHgDytaBmm/exec";

    const LIFF_ID =
      "2011319319-1bUfgtSJ";


    /* =====================================================
       GLOBAL
       ===================================================== */

    let liffUserId = "";
    let liffUserName = "";

    let base64Image = "";

    let html5QrCode = null;
    let activeTargetInputId = "";

    let searchTimeout = null;


    /* =====================================================
       LIFF INIT
       ===================================================== */

    async function main() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });


        if (liff.isLoggedIn()) {

          const profile =
            await liff.getProfile();

          liffUserId =
            profile.userId || "";

          liffUserName =
            profile.displayName ||
            "ไม่ระบุชื่อ";


          /*
           * คงพฤติกรรมหน้าเดิม
           */
          document.getElementById(
            'reporterInput'
          ).value = liffUserName;


        } else {

          liff.login();

        }

      } catch (err) {

        console.error(
          "LIFF Init Error:",
          err
        );

      }

    }


    window.onload = main;


    /* =====================================================
       LINE OPTIONS
       ===================================================== */

    function updateLineOptions() {

      const floor =
        document.getElementById('floorSelect').value;

      const lineSelect =
        document.getElementById('lineSelect');

      lineSelect.innerHTML =
        '<option value="">-- กรุณาเลือก LINE --</option>';

      let lines = [];

      if (floor === 'ชั้น 3') {
        lines = ['B', 'C', 'อะไหล่ชั้น 3'];
      }
      else if (floor === 'ชั้น 4') {
        lines = ['D', 'E', 'F', 'อะไหล่ชั้น 4'];
      }

      lines.forEach(line => {
        const option = document.createElement('option');
        option.value = line;
        option.textContent = line;
        lineSelect.appendChild(option);
      });

    }


    /* =====================================================
       SWITCH TAB
       ===================================================== */

    function switchTab(tabName) {

      const tabs =
        document.querySelectorAll('.tab-btn');

      tabs.forEach(btn => {
        btn.classList.remove('active');
      });


      document.getElementById(
        'tabReport'
      ).style.display = 'none';

      document.getElementById(
        'tabMyJobs'
      ).style.display = 'none';

      document.getElementById(
        'tabTechnician'
      ).style.display = 'none';


      if (tabName === 'report') {

        tabs[0].classList.add('active');

        document.getElementById(
          'tabReport'
        ).style.display = 'block';

      }


      else if (tabName === 'myjobs') {

        tabs[1].classList.add('active');

        document.getElementById(
          'tabMyJobs'
        ).style.display = 'block';

        loadMyJobs();

      }


      else if (tabName === 'technician') {

        tabs[2].classList.add('active');

        document.getElementById(
          'tabTechnician'
        ).style.display = 'block';

      }

    }


    /* =====================================================
       TAB 2
       LOAD MY JOBS
       ===================================================== */

    async function loadMyJobs() {

      const container =
        document.getElementById(
          'myJobsContainer'
        );


      if (!liffUserId) {

        container.innerHTML = `
          <div class="error-state">
            ไม่พบ LINE User ID
          </div>
        `;

        return;

      }


      container.innerHTML = `
        <div class="loading-state">
          🔄 กำลังโหลดรายการงาน...
        </div>
      `;


      try {

        const url =
          GAS_WEB_APP_URL +
          "?action=getMyRepairJobs&userId=" +
          encodeURIComponent(liffUserId);


        const res =
          await fetch(url);


        const data =
          await res.json();


        if (
          !data.jobs ||
          data.jobs.length === 0
        ) {

          container.innerHTML = `
            <div class="empty-state">
              <div style="font-size:35px;margin-bottom:8px;">
                📭
              </div>

              ยังไม่มีงานแจ้งซ่อมของคุณ
            </div>
          `;

          return;

        }


        let html = "";


        data.jobs.forEach(job => {

          html += createMyJobCard(job);

        });


        container.innerHTML = html;


      } catch (err) {

        console.error(
          "loadMyJobs Error:",
          err
        );


        container.innerHTML = `
          <div class="error-state">
            ⚠️ ไม่สามารถดึงรายการงานได้
            <br>
            <span style="font-size:11px;">
              กรุณาลองกดรีเฟรชอีกครั้ง
            </span>
          </div>
        `;

      }

    }


    /* =====================================================
       CREATE JOB CARD
       ===================================================== */

    function createMyJobCard(job) {

      const status =
        job.status || "รอดำเนินการ";


      let badgeClass =
        "badge-pending";


      if (status === "รับงานแล้ว") {

        badgeClass =
          "badge-accepted";

      }


      else if (
        status === "กำลังดำเนินการ"
      ) {

        badgeClass =
          "badge-progress";

      }


      else if (
        status === "เสร็จสิ้น"
      ) {

        badgeClass =
          "badge-done";

      }


      else if (
        status === "รออะไหล่"
      ) {

        badgeClass =
          "badge-waiting";

      }


      else if (
        status === "ซ่อมไม่ได้"
      ) {

        badgeClass =
          "badge-cannot";

      }


      else if (
        status === "ส่งต่อช่างอื่น"
      ) {

        badgeClass =
          "badge-forward";

      }


      let timeHtml = "";


      if (
        job.startDate ||
        job.startTime ||
        job.finishDate ||
        job.finishTime
      ) {

        timeHtml = `
          <div class="job-time">

            ${
              job.startDate || job.startTime
                ? `🟢 เริ่มงาน: ${
                    job.startDate || "-"
                  } ${
                    job.startTime || ""
                  }`
                : ""
            }

            ${
              job.finishDate || job.finishTime
                ? `<br>🔵 เสร็จงาน: ${
                    job.finishDate || "-"
                  } ${
                    job.finishTime || ""
                  }`
                : ""
            }

          </div>
        `;

      }


      return `

        <div class="job-item">

          <div class="job-header">

            <span class="job-id">
              ${escapeHtml(job.jobId || "-")}
            </span>

            <span class="job-badge ${badgeClass}">
              ${escapeHtml(status)}
            </span>

          </div>


          <div class="job-detail-row">
            <b>📍 ชั้น:</b>
            ${escapeHtml(job.floor || "-")}
          </div>


          <div class="job-detail-row">
            <b>⚙️ เครื่องจักร:</b>
            ${escapeHtml(job.machineCode || "-")}
            ${
              job.machineName
                ? ` (${escapeHtml(job.machineName)})`
                : ""
            }
          </div>


          <div class="job-detail-row">
            <b>📝 อาการ:</b>
            ${escapeHtml(job.issue || "-")}
          </div>


          <div class="job-detail-row">
            <b>👨‍🔧 ช่าง:</b>
            ${escapeHtml(job.techName || "ยังไม่มีช่างรับงาน")}
          </div>


          ${
            job.result
              ? `
                <div class="job-detail-row">
                  <b>🔧 ผลการซ่อม:</b>
                  ${escapeHtml(job.result)}
                </div>
              `
              : ""
          }


          <div class="job-detail-row"
               style="font-size:11px;color:#94a3b8;margin-top:7px;">

            แจ้งเมื่อ:
            ${escapeHtml(job.date || "-")}
            ${job.time ? " " + escapeHtml(job.time) : ""}

          </div>


          ${timeHtml}

        </div>

      `;

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       BARCODE
       ===================================================== */

    function startBarcodeScanner(inputId) {

      activeTargetInputId =
        inputId;


      document.getElementById(
        'scannerModal'
      ).style.display = 'flex';


      if (!html5QrCode) {

        html5QrCode =
          new Html5Qrcode("reader");

      }


      const config = {

        fps: 20,

        qrbox: {
          width: 300,
          height: 120
        }

      };


      html5QrCode.start(

        {
          facingMode: "environment"
        },

        config,

        (decodedText) => {

          if (activeTargetInputId) {

            document.getElementById(
              activeTargetInputId
            ).value =
              decodedText;


            if (
              activeTargetInputId ===
              'machineCodeInput'
            ) {

              lookupMachineName();

            }

          }


          stopBarcodeScanner();

        }

      ).catch(err => {

        alert(
          "ไม่สามารถเปิดกล้องได้: " +
          err
        );

        stopBarcodeScanner();

      });

    }


    function stopBarcodeScanner() {

      if (
        html5QrCode &&
        html5QrCode.isScanning
      ) {

        html5QrCode
          .stop()
          .then(() => {

            document.getElementById(
              'scannerModal'
            ).style.display = 'none';

          });

      } else {

        document.getElementById(
          'scannerModal'
        ).style.display = 'none';

      }

    }


    /* =====================================================
       MACHINE LOOKUP
       ===================================================== */

    function lookupMachineName() {

      const code =
        document.getElementById(
          'machineCodeInput'
        ).value.trim();


      const nameInput =
        document.getElementById(
          'machineNameInput'
        );


      const statusText =
        document.getElementById(
          'machineStatus'
        );


      if (!code) {

        nameInput.value = "";
        statusText.innerText = "";

        return;

      }


      statusText.innerText =
        "🔍 กำลังค้นหา...";


      clearTimeout(
        searchTimeout
      );


      searchTimeout =
        setTimeout(async () => {

          try {

            const res =
              await fetch(
                GAS_WEB_APP_URL +
                "?action=getMachineName&code=" +
                encodeURIComponent(code)
              );


            const data =
              await res.json();


            if (data.name) {

              nameInput.value =
                data.name;

              statusText.innerText =
                "✅ พบข้อมูล";

              statusText.style.color =
                "#1DB954";

            }

            else {

              nameInput.value = "";

              statusText.innerText =
                "❌ ไม่พบรหัสนี้";

              statusText.style.color =
                "#e53e3e";

            }


          } catch (err) {

            console.error(err);

            statusText.innerText =
              "⚠️ ดึงข้อมูลไม่ได้";

            statusText.style.color =
              "#e53e3e";

          }

        }, 500);

    }


    /* =====================================================
       IMAGE
       ===================================================== */

    function previewImage(e) {

      const file =
        e.target.files[0];


      if (file) {

        const reader =
          new FileReader();


        reader.onload =
          (evt) => {

            document.getElementById(
              'previewImg'
            ).src =
              evt.target.result;


            document.getElementById(
              'imagePreview'
            ).style.display =
              'block';


            base64Image =
              evt.target.result;

          };


        reader.readAsDataURL(file);

      }

    }


    /* =====================================================
       CLOSE LIFF
       ===================================================== */

    function closeLiff() {

      if (
        typeof liff !== "undefined" &&
        liff.isInClient()
      ) {

        liff.closeWindow();

      }

    }


    /* =====================================================
       SUBMIT REPAIR
       ===================================================== */

    document
      .getElementById('repairForm')
      .addEventListener(
        'submit',
        async (e) => {

          e.preventDefault();


          const submitBtn =
            document.getElementById(
              'submitBtn'
            );


          submitBtn.disabled =
            true;

          submitBtn.innerText =
            "กำลังส่ง...";


          const payload = {

            action:
              'CREATE_REPAIR_JOB',

            floor:
              document.getElementById(
                'floorSelect'
              ).value,

            line:
              document.getElementById(
                'lineSelect'
              ).value,

            reporter:
              document.getElementById(
                'reporterInput'
              ).value,

            machineCode:
              document.getElementById(
                'machineCodeInput'
              ).value.trim(),

            machineName:
              document.getElementById(
                'machineNameInput'
              ).value.trim(),

            issue:
              document.getElementById(
                'issueInput'
              ).value,

            image:
              base64Image || "",

            userId:
              liffUserId

          };


          try {

            const res =
              await fetch(
                GAS_WEB_APP_URL,
                {
                  method: 'POST',
                  body:
                    JSON.stringify(payload)
                }
              );


            const result =
              await res.json();


            if (
              result.status ===
              "success"
            ) {

              alert(
                "แจ้งซ่อมเรียบร้อย!"
              );


              closeLiff();

            }

            else {

              alert(
                "เกิดข้อผิดพลาด: " +
                (
                  result.error ||
                  "ไม่สามารถบันทึกงานได้"
                )
              );

            }


          } catch (err) {

            console.error(err);

            alert(
              "เกิดข้อผิดพลาดในการเชื่อมต่อ"
            );

          }


          finally {

            submitBtn.disabled =
              false;

            submitBtn.innerText =
              "ส่งแจ้งซ่อม";

          }

        }
      );

  </script>

</body>
